services:
  # Dependencies - Platform Profile
  postgres:
    profiles: ["platform"]
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 5s
      timeout: 5s

  redis:
    profiles: ["platform"]
    image: redis:6.2.7-alpine
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    ports:
      - "6379:6379"
      - "6479:6479"  # CDP Redis port
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s

  zookeeper:
    profiles: ["platform"]
    image: zookeeper:3.7.0
    restart: on-failure

  kafka:
    profiles: ["platform"]
    image: ghcr.io/posthog/kafka-container:v2.8.2
    environment:
      KAFKA_BROKER_ID: 1001
      KAFKA_CFG_RESERVED_BROKER_MAX_ID: 1001
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: 'true'
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1
      interval: 3s
      timeout: 10s

  clickhouse:
    profiles: ["platform"]
    image: clickhouse/clickhouse-server:24.8.14.39
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./docker/clickhouse/users-dev.xml:/etc/clickhouse-server/users.xml

  objectstorage:
    profiles: ["platform"]
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    environment:
      MINIO_ROOT_USER: object_storage_root_user
      MINIO_ROOT_PASSWORD: object_storage_root_password
    command: sh -c 'mkdir -p /data/posthog && minio server --address ":19000" --console-address ":19001" /data'
    ports:
      - "19000:19000"
      - "19001:19001"

  # Plugin Server - Production Build (Default - no profile)
  plugins:
    build:
      context: ..
      dockerfile: plugin-server/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "6738:6738"
    volumes:
      - ../share:/share
    environment:
      DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      KAFKA_HOSTS: 'kafka:9092'
      REDIS_URL: 'redis://redis:6379/'
      CDP_REDIS_HOST: 'redis7'
      CDP_REDIS_PORT: '6379'
      CDP_REDIS_PASSWORD: ''
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_DATABASE: 'posthog'
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      CYCLOTRON_DATABASE_URL: 'postgres://posthog:posthog@db:5432/cyclotron'
      OBJECT_STORAGE_ENDPOINT: 'http://objectstorage:19000'
      OBJECT_STORAGE_REGION: 'us-east-1'
      OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
      OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
      OBJECT_STORAGE_BUCKET: 'posthog'
      DEBUG: '1'

  # Plugin Server - Development Build (Default - no profile)
  plugins-dev:
    build:
      context: ..
      dockerfile: plugin-server/Dockerfile
      target: development
    ports:
      - "6739:6738"
    volumes:
      # Mount source code for hot reload
      - ../plugin-server/src:/app/plugin-server/src:ro
      - ../common/hogvm/typescript/src:/app/common/hogvm/typescript/src:ro
      # Mount GeoIP database
      - ../share:/share
    environment:
      DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      KAFKA_HOSTS: 'kafka:9092'
      REDIS_URL: 'redis://redis:6379/'
      CDP_REDIS_HOST: 'redis7'
      CDP_REDIS_PORT: '6379'
      CDP_REDIS_PASSWORD: ''
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_DATABASE: 'posthog'
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      CYCLOTRON_DATABASE_URL: 'postgres://posthog:posthog@db:5432/cyclotron'
      INGESTION_CONSUMER_GROUP_ID: 'events-ingestion-consumer-dev'
      CDP_LEGACY_EVENT_CONSUMER_GROUP_ID: 'clickhouse-plugin-server-async-onevent-dev'
      PROPERTY_DEFS_CONSUMER_GROUP_ID: 'property-defs-consumer-dev'
      OBJECT_STORAGE_ENDPOINT: 'http://objectstorage:19000'
      OBJECT_STORAGE_REGION: 'us-east-1'
      OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
      OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
      OBJECT_STORAGE_BUCKET: 'posthog'
      DEBUG: '1'
      NODE_ENV: 'development'

  # Migration service (Platform Profile)
  migrate:
    profiles: ["platform"]
    build:
      context: ..
      dockerfile: plugin-server/Dockerfile
      target: runtime
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'Running migrations...' &&
        python manage.py migrate &&
        python manage.py migrate_clickhouse &&
        echo 'Migrations completed!'
      "
    environment:
      DATABASE_URL: 'postgres://posthog:posthog@postgres:5432/posthog'
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_DATABASE: 'posthog'
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started

networks:
  default:
    external: true
    name: posthog_default 